spring.application.name=booking-service
server.port=8080
spring.datasource.url=${RUSHBOOK_BOOKING_DB_URL:jdbc:postgresql://localhost:5432/rushbook}
spring.datasource.username=${RUSHBOOK_BOOKING_DB_USERNAME:booking_app}
spring.datasource.password=${RUSHBOOK_BOOKING_DB_PASSWORD:replace-me-for-local-only}
spring.flyway.default-schema=booking
spring.flyway.schemas=booking
spring.flyway.locations=classpath:db/migration
