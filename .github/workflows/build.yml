name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  service:
    name: ${{ matrix.service }} build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - booking-service
          - notification-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build and test ${{ matrix.service }}
        run: ./gradlew --no-daemon :${{ matrix.service }}:build
